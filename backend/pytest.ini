[pytest]
addopts = --cov=app --cov-report=term-missing --cov-fail-under=80 -m "not integration"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    security_regression: critical security regression checks (tenant isolation and similar)
    integration: tests that require real external dependencies (for example PostgreSQL)
filterwarnings =
    ignore:.*asyncio\.iscoroutinefunction.*:DeprecationWarning:fastapi\.routing
    ignore:.*tagMap is deprecated.*:DeprecationWarning
    ignore:.*typeMap is deprecated.*:DeprecationWarning
    ignore:.*AbstractItemEncoder is deprecated.*:DeprecationWarning
    ignore:.*on_event is deprecated, use lifespan event handlers instead.*:DeprecationWarning:fastapi\.applications

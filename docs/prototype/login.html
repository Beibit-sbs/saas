<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login — SBS UB</title>
<link rel="stylesheet" href="./_shared/style.css">
<style>
body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:#f1f5f9; }
.login-box { background:#fff; border:1px solid #e2e8f0; border-radius:10px; padding:36px 40px; width:360px; }
.login-box h2 { font-size:20px; font-weight:700; margin-bottom:6px; }
.login-box p { color:#64748b; font-size:13px; margin-bottom:24px; }
</style>
</head>
<body>
<div class="login-box">
  <h2>Sign in to SBS UB</h2>
  <p>Enter your university credentials</p>
  <div class="form-group"><label class="form-label">Email</label><input class="form-control" placeholder="user@univ.edu"></div>
  <div class="form-group"><label class="form-label">Password</label><input class="form-control" type="password" placeholder="••••••••"></div>
  <button class="btn btn-primary" style="width:100%;justify-content:center;margin-top:8px">Sign In</button>
  <div style="text-align:center;margin-top:14px;font-size:12px;color:#64748b">
    <a href="#">Forgot password?</a> · <a href="#">SSO Login</a>
  </div>
</div>
</body></html>

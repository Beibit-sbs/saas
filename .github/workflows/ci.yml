  frontend-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          EOF
      - name: Build frontend test image
        working-directory: infra
        run: docker compose --env-file .env build frontend-tests
      - name: Run frontend type-check
        working-directory: infra
        run: docker compose --env-file .env run --rm frontend-tests npm run type-check
      - name: Run frontend tests
        working-directory: infra
        run: docker compose --env-file .env run --rm frontend-tests npm run test:frontend

  migration-safety-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          EOF
      - name: Build backend test image
        working-directory: infra
        run: docker compose --env-file .env build backend-tests
      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend
      - name: Run migration heads check
        working-directory: infra
        run: docker compose --env-file .env run --rm --no-deps backend-tests alembic heads
      - name: Run migration upgrade check
        working-directory: infra
        run: docker compose --env-file .env run --rm --no-deps backend-tests alembic upgrade head
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --env-file .env down -v

  template-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          EOF
      - name: Build backend test image
        working-directory: infra
        run: docker compose --env-file .env build backend-tests
      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend
      - name: Run template validation
        working-directory: infra
        run: docker compose --env-file .env run --rm --no-deps backend-tests pytest -q tests/test_template_validation.py
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --env-file .env down -v

  test-evidence-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          EOF
      - name: Prepare artifact directories
        run: |
          mkdir -p artifacts/backend
          mkdir -p artifacts/frontend
      - name: Build test images
        working-directory: infra
        run: docker compose --env-file .env build backend-tests frontend-tests
      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend frontend nginx
      - name: Backend evidence (junit + coverage)
        working-directory: infra
        run: |
          docker compose --env-file .env run --rm --no-deps \
            -v ${{ github.workspace }}/artifacts/backend:/artifacts \
            backend-tests \
            pytest -q \
              --junitxml=/artifacts/junit.xml \
              --cov=app \
              --cov-report=xml:/artifacts/coverage.xml \
              --cov-report=html:/artifacts/coverage-html
      - name: Frontend evidence (junit + coverage)
        working-directory: infra
        run: |
          docker compose --env-file .env run --rm \
            -v ${{ github.workspace }}/artifacts/frontend:/artifacts \
            frontend-tests \
            npm run test:frontend -- \
              --reporter=junit \
              --outputFile=/artifacts/junit.xml \
              --coverage \
              --coverage.reporter=html \
              --coverage.reporter=cobertura \
              --coverage.reporter=text-summary \
              --coverage.reportsDirectory=/artifacts/coverage-html
      - name: Upload backend evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-evidence
          path: artifacts/backend
          retention-days: 30
      - name: Upload frontend evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence
          path: artifacts/frontend
          retention-days: 30
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --env-file .env down -v

  frontend-role-zones-e2e-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          PLATFORM_ADMIN_LOGIN=ci_platform_admin
          PLATFORM_ADMIN_PASSWORD=ci_e2e_adminPass_123
          PLATFORM_ADMIN_EMAIL=ci_platform_admin@ci.test.local
          PLATFORM_ADMIN_UPDATE_PASSWORD=false
          PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE=false
          EOF
      - name: Build frontend e2e images
        working-directory: infra
        run: docker compose --env-file .env build frontend frontend-tests
      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend frontend nginx
      - name: Run role-zones e2e smoke
        working-directory: infra
        run: |
          docker compose --env-file .env run --rm \
            -e E2E_BASE_URL=http://nginx \
            -e PLATFORM_ADMIN_LOGIN=ci_platform_admin \
            -e PLATFORM_ADMIN_PASSWORD=ci_e2e_adminPass_123 \
            frontend-tests npm run test:e2e -- e2e/smoke/role-zones.spec.ts
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --env-file .env down -v

  release-readiness-gate:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - architecture-governance-gate
      - tenant-safety-gate
      - platform-regression-gate
      - frontend-safety-gate
      - migration-safety-gate
      - template-validation
      - test-evidence-artifacts
      - frontend-role-zones-e2e-gate
    steps:
      - name: Verify all required jobs passed
        run: |
          [ "${{ needs.architecture-governance-gate.result }}" = "success" ]
          [ "${{ needs.tenant-safety-gate.result }}" = "success" ]
          [ "${{ needs.platform-regression-gate.result }}" = "success" ]
          [ "${{ needs.frontend-safety-gate.result }}" = "success" ]
          [ "${{ needs.migration-safety-gate.result }}" = "success" ]
          [ "${{ needs.template-validation.result }}" = "success" ]
          [ "${{ needs.test-evidence-artifacts.result }}" = "success" ]
          [ "${{ needs.frontend-role-zones-e2e-gate.result }}" = "success" ]

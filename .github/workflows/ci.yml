name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tenant-safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-suite-secret-not-for-prod-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Tenant safety audit gate
        run: pytest -q tests/platform/test_platform_tenant_safety_audit_v1.py

  platform-regression-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-suite-secret-not-for-prod-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Lint backend
        run: ruff check .
      - name: Platform regression suite
        run: pytest -q tests/platform/
      - name: Security regression (critical)
        run: pytest -q -m security_regression

  frontend-safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install
      - name: TypeScript type-check
        run: npm run type-check
      - name: Check i18n parity
        run: npm run i18n:check
      - name: Lint frontend
        run: npm run lint
      - name: Frontend regression tests
        run: npm run test:frontend

  migration-safety-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-suite-secret-not-for-prod-1234567890
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/platform_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: platform_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Log migration heads
        run: alembic heads
      - name: Migration smoke (upgrade -> downgrade -1 -> upgrade)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

  template-validation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: test-suite-secret-not-for-prod-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run template validation
        run: pytest -q tests/test_template_validation.py

          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456

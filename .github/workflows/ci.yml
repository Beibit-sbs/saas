name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  architecture-governance-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create CI env file
        working-directory: infra
        run: |
          cat > .env <<'EOF'
          COMPOSE_PROJECT_NAME=ai
          POSTGRES_DB=app
          POSTGRES_USER=app
          POSTGRES_PASSWORD=app
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://app:app@db:5432/app
          REDIS_URL=redis://redis:6379/0
          BACKEND_PORT=8000
          FRONTEND_PORT=3000
          NGINX_PORT=80
          NGINX_TLS_PORT=443
          NEXT_PUBLIC_API_BASE_URL=/api
          API_BASE_URL=http://nginx
          ADMIN_PANEL_URL=http://nginx
          INTERNAL_API_TOKEN=test_internal_api_token_12345678901234567890
          JWT_SECRET=test_suite_secret_not_for_prod_1234567890123456
          INTEGRATIONS_ENCRYPTION_KEY=test_integration_key_1234567890123456
          AUTH_CSRF_PROTECTION_ENABLED=true
          RBAC_ALLOW_DEV_FALLBACK=false
          METRICS_TOKEN=test_metrics_token_12345678901234567890
          EOF
      - name: Build backend test image
        working-directory: infra
        run: docker compose --env-file .env build backend-tests
      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend
      - name: Run architecture governance gate
        working-directory: infra
        run: docker compose --env-file .env run --rm --no-deps backend-tests pytest -q tests/platform/test_platform_architecture_guardrails_v1.py
      - name: Stop stack
        if: always()
        working-directory: infra
        run: docker compose --env-file .env down -v


      - name: Start required services
        working-directory: infra
        run: docker compose --env-file .env up -d db redis backend
      - name: Run tenant safety gate
        working-directory: infra
        run: docker compose --env-file .env run --rm --no-deps backend-tests pytest -q tests/platform/test_platform_tenant_safety_audit_v1.py

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      PLATFORM_ADMIN_LOGIN: ${PLATFORM_ADMIN_LOGIN}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_UPDATE_PASSWORD: ${PLATFORM_ADMIN_UPDATE_PASSWORD:-true}
      PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE: ${PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE:-false}
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      METRICS_TOKEN: ${METRICS_TOKEN}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_LATENCY_P95_THRESHOLD_MS: ${OPS_LATENCY_P95_THRESHOLD_MS:-1000}
      OPS_LATENCY_P99_THRESHOLD_MS: ${OPS_LATENCY_P99_THRESHOLD_MS:-2500}
      OPS_JOBS_FAILURE_SPIKE_THRESHOLD: ${OPS_JOBS_FAILURE_SPIKE_THRESHOLD:-5}
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,backend,nginx}"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - backup_data:/tmp/app-backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/modes')"]
      interval: 15s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
    command:
      - sh
      - -lc
      - |
        echo "worker loop started"
        while true; do
          python -u -c "from app.modules.jobs.worker import run_worker_loop; from app.platform.runtime_state import record_worker_heartbeat; record_worker_heartbeat(); run_worker_loop(iterations=200)"
          sleep 1
        done
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backup_data:/tmp/app-backups

  scheduler:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      METRICS_TOKEN: ${METRICS_TOKEN}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_LATENCY_P95_THRESHOLD_MS: ${OPS_LATENCY_P95_THRESHOLD_MS:-1000}
      OPS_LATENCY_P99_THRESHOLD_MS: ${OPS_LATENCY_P99_THRESHOLD_MS:-2500}
      OPS_JOBS_FAILURE_SPIKE_THRESHOLD: ${OPS_JOBS_FAILURE_SPIKE_THRESHOLD:-5}
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
    command:
      - sh
      - -lc
      - |
        echo "scheduler loop started"
        python -u -c "from app.platform.jobs.scheduler import scheduler; scheduler.run_forever(poll_interval_seconds=5.0)"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from datetime import datetime, timezone; from app.core.config import get_ops_scheduler_stale_seconds; from app.platform.runtime_state import get_scheduler_last_run; s=get_scheduler_last_run(); at=(s or {}).get('at') if isinstance(s, dict) else None; dt=datetime.fromisoformat(at) if at else None; age=(datetime.now(timezone.utc)-dt).total_seconds() if dt else 1e9; raise SystemExit(0 if age <= get_ops_scheduler_stale_seconds() else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - backup_data:/tmp/app-backups

  frontend:
    build:
      context: ../frontend
      args:
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/internal/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend-tests:
    build:
      context: ../frontend
      dockerfile: Dockerfile.test
    environment:
      CI: "1"
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO /dev/null https://127.0.0.1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro,Z
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai_postgres_data
  backup_data:
  prometheus_data:

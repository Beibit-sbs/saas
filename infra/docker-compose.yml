services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    entrypoint: ["sh", "-c", "export DATABASES_HOST=$(getent hosts db | awk '{print $1}') && exec /opt/pgbouncer/entrypoint.sh"]
    environment:
      DATABASES_HOST: db
      DATABASES_PORT: 5432
      DATABASES_USER: ${POSTGRES_USER}
      DATABASES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASES_DBNAME: ${POSTGRES_DB}
      PGBOUNCER_AUTH_TYPE: any
      PGBOUNCER_POOL_MODE: transaction
      PGBOUNCER_MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-200}
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      PGBOUNCER_IGNORE_STARTUP_PARAMETERS: extra_float_digits,options
      PGBOUNCER_ADMIN_USERS: ${POSTGRES_USER}
      PGBOUNCER_LISTEN_PORT: ${PGBOUNCER_PORT:-6432}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${PGBOUNCER_PORT:-6432}"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  ldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: "University"
      LDAP_DOMAIN: "example.local"
      LDAP_BASE_DN: "dc=example,dc=local"
      LDAP_LOG_LEVEL: "256"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost", "-D", "cn=admin,dc=example,dc=local", "-w", "admin"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    environment:
      PYTHONPATH: /app
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:${PGBOUNCER_PORT:-6432}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      PLATFORM_ADMIN_LOGIN: ${PLATFORM_ADMIN_LOGIN}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      PLATFORM_ADMIN_UPDATE_PASSWORD: ${PLATFORM_ADMIN_UPDATE_PASSWORD:-true}
      PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE: ${PLATFORM_ADMIN_FORCE_PASSWORD_CHANGE:-false}
      LOCAL_TENANT_ADMIN_BOOTSTRAP_ENABLED: "${LOCAL_TENANT_ADMIN_BOOTSTRAP_ENABLED:-false}"
      LOCAL_TENANT_ADMIN_TENANT_ID: "${LOCAL_TENANT_ADMIN_TENANT_ID:-1}"
      LOCAL_TENANT_ADMIN_LOGINS: "${LOCAL_TENANT_ADMIN_LOGINS:-inst_admin,acad_admin}"
      LOCAL_TENANT_ADMIN_PASSWORD: "${LOCAL_TENANT_ADMIN_PASSWORD:-}"
      LOCAL_TENANT_ADMIN_UPDATE_PASSWORD: "${LOCAL_TENANT_ADMIN_UPDATE_PASSWORD:-true}"
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      METRICS_TOKEN: ${METRICS_TOKEN}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_LATENCY_P95_THRESHOLD_MS: ${OPS_LATENCY_P95_THRESHOLD_MS:-1000}
      OPS_LATENCY_P99_THRESHOLD_MS: ${OPS_LATENCY_P99_THRESHOLD_MS:-2500}
      OPS_JOBS_FAILURE_SPIKE_THRESHOLD: ${OPS_JOBS_FAILURE_SPIKE_THRESHOLD:-5}
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
      AUTH_EMBED_PERMISSIONS_IN_ACCESS_TOKEN: "${AUTH_EMBED_PERMISSIONS_IN_ACCESS_TOKEN:-false}"
      BILLING_DB_ONLY_MODE: "${BILLING_DB_ONLY_MODE:-true}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,backend,nginx}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_CUSTOM_PROVIDER_URL: "${AI_CUSTOM_PROVIDER_URL:-}"
      AI_CUSTOM_PROVIDER_API_KEY: "${AI_CUSTOM_PROVIDER_API_KEY:-}"
      AI_PROVIDER_TIMEOUT_SECONDS: "${AI_PROVIDER_TIMEOUT_SECONDS:-8}"
    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - backup_data:/tmp/app-backups
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/modes')"]
      interval: 15s
      timeout: 5s
      retries: 10

  backend-tests:
    build:
      context: ../backend
      dockerfile: Dockerfile.tests
    working_dir: /app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:${PGBOUNCER_PORT:-6432}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      PLATFORM_ADMIN_LOGIN: ${PLATFORM_ADMIN_LOGIN}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL}
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
      BILLING_DB_ONLY_MODE: "${BILLING_DB_ONLY_MODE:-true}"
      TRUSTED_HOSTS: "${TRUSTED_HOSTS:-localhost,127.0.0.1,backend,backend-tests,nginx}"
      PROJECT_ROOT: "/project"
    volumes:
      - ..:/project:ro,z
      - backup_data:/tmp/app-backups
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    command:
      - sh
      - -lc
      - pytest -q

  worker:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:${PGBOUNCER_PORT:-6432}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
      BILLING_DB_ONLY_MODE: "${BILLING_DB_ONLY_MODE:-true}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      AI_CUSTOM_PROVIDER_URL: "${AI_CUSTOM_PROVIDER_URL:-}"
      AI_CUSTOM_PROVIDER_API_KEY: "${AI_CUSTOM_PROVIDER_API_KEY:-}"
      AI_PROVIDER_TIMEOUT_SECONDS: "${AI_PROVIDER_TIMEOUT_SECONDS:-8}"
    command: ["python", "-u", "scripts/run_worker.py"]
    stop_signal: SIGTERM
    stop_grace_period: 30s
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - backup_data:/tmp/app-backups

  scheduler:
    build:
      context: ../backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pgbouncer:${PGBOUNCER_PORT:-6432}/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      API_BASE_URL: ${API_BASE_URL}
      ADMIN_PANEL_URL: ${ADMIN_PANEL_URL}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY}
      BACKUP_DEFAULT_PROFILE: "${BACKUP_DEFAULT_PROFILE:-local}"
      BACKUP_ALLOWED_ROOTS: "${BACKUP_ALLOWED_ROOTS:-/tmp/app-backups,/var/backups/app}"
      BACKUP_PROFILES_JSON: "${BACKUP_PROFILES_JSON:-[{\"id\":\"local\",\"label\":\"Local backup volume\",\"path\":\"/tmp/app-backups/local\"}]}"
      METRICS_TOKEN: ${METRICS_TOKEN}
      OPS_ALERT_WEBHOOK_URL: ${OPS_ALERT_WEBHOOK_URL:-}
      OPS_ALERT_COOLDOWN_SECONDS: ${OPS_ALERT_COOLDOWN_SECONDS:-300}
      OPS_LATENCY_P95_THRESHOLD_MS: ${OPS_LATENCY_P95_THRESHOLD_MS:-1000}
      OPS_LATENCY_P99_THRESHOLD_MS: ${OPS_LATENCY_P99_THRESHOLD_MS:-2500}
      OPS_JOBS_FAILURE_SPIKE_THRESHOLD: ${OPS_JOBS_FAILURE_SPIKE_THRESHOLD:-5}
      RBAC_ALLOW_DEV_FALLBACK: "${RBAC_ALLOW_DEV_FALLBACK:-false}"
      AUTH_CSRF_PROTECTION_ENABLED: "${AUTH_CSRF_PROTECTION_ENABLED:-true}"
      BILLING_DB_ONLY_MODE: "${BILLING_DB_ONLY_MODE:-true}"
    command:
      - sh
      - -lc
      - |
        echo "scheduler loop started"
        python -u -c "from app.platform.jobs.scheduler import scheduler; scheduler.run_forever(poll_interval_seconds=5.0)"
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from datetime import datetime, timezone; from app.core.config import get_ops_scheduler_stale_seconds; from app.platform.runtime_state import get_scheduler_last_run; s=get_scheduler_last_run(); at=(s or {}).get('at') if isinstance(s, dict) else None; dt=datetime.fromisoformat(at) if at else None; age=(datetime.now(timezone.utc)-dt).total_seconds() if dt else 1e9; raise SystemExit(0 if age <= get_ops_scheduler_stale_seconds() else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - backup_data:/tmp/app-backups

  frontend:
    build:
      context: ../frontend
      args:
        API_BASE_URL: ${API_BASE_URL}
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    environment:
      NODE_ENV: production
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/api/internal/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  frontend-tests:
    build:
      context: ../frontend
      dockerfile: Dockerfile.test
    environment:
      CI: "1"
      API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      nginx:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro,Z
      - ./nginx/certs:/etc/nginx/certs:ro,Z
    ports:
      - "${NGINX_PORT}:80"
      - "${NGINX_TLS_PORT:-443}:443"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -qO /dev/null https://127.0.0.1/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.52.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro,Z
      - ./prometheus/metrics_token:/etc/prometheus/metrics_token:ro,Z
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.12
    profiles: ["devtools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-ops@local.dev}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-change_me_pgadmin_password}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    ports:
      - "${PGADMIN_BIND_ADDRESS:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    profiles: ["devtools"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./grafana/dashboards:/etc/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_data:
    name: ai_postgres_data
  backup_data:
  prometheus_data:
  pgadmin_data:
  grafana_data:
  ldap_data:
    name: ai_ldap_data
  ldap_config:
    name: ai_ldap_config

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: production

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics_token
    static_configs:
      - targets:
          - backend:8000
        labels:
          service: backend
